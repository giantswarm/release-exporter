# Values for the app-test-suite smoke (tests/ats/test_smoke.py) on the bare kind cluster
# the generated execute-chart-tests job creates. Layered over the chart defaults, see
# .ats/main.yaml (app-tests-app-config-file).

image:
  # Branch builds publish no image (build-image runs with push: false) and the orb stamps
  # appVersion with the dev version, so the chart's default tag exists in no registry.
  # Pin the latest release; bump it when the chart needs a newer image.
  tag: "0.1.16"

# The grafana-agent sidecar refuses to start on an empty remote_write URL. Nothing listens
# here; the agent just logs failed pushes.
cortex:
  url: http://cortex.invalid/api/v1/push
  username: smoke
  password: smoke
